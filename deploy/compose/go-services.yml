services:
  api-gateway:
    build: ../../src/api-gateway
    image: foodkoala/api-gateway:local
    ports: ["8080:8080"]
    # No environment: every upstream URL defaults to its compose service name.
    depends_on:
      # Its signing keys (JWKS) are what the gateway checks tokens with; it's
      # not ready until it has fetched them once.
      auth-service: { condition: service_started }
    healthcheck:
      # The distroless image has no shell or wget; the binary checks its own /readyz.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
  delivery-service:
    build: ../../src/delivery-service
    image: foodkoala/delivery-service:local
    ports: ["8081:8081"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foodkoala}:${POSTGRES_PASSWORD:-foodkoala}@postgres:5432/${POSTGRES_DB:-foodkoala}
      # Order events in, delivery events out
      KAFKA_BROKERS: kafka:29092
    depends_on:
      delivery-migrate: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    healthcheck:
      # The distroless image has no shell or wget; the binary checks its own /readyz.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
  delivery-migrate:
    image: foodkoala/delivery-service:local
    pull_policy: never
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foodkoala}:${POSTGRES_PASSWORD:-foodkoala}@postgres:5432/${POSTGRES_DB:-foodkoala}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  chat-service:
    build: ../../src/chat-service
    image: foodkoala/chat-service:local
    ports: ["8083:8083"]
    environment:
      # Chats and messages, in the database `chat`
      MONGO_URL: mongodb://mongo:27017
      # Live messages between replicas; its own database number
      REDIS_URL: redis://redis:6379/3
      # delivery.assigned opens a chat; delivery.delivered and order.status_changed close it
      KAFKA_BROKERS: kafka:29092
      # Photos, in a private bucket made on start
      S3_ENDPOINT: s3:8333
      S3_ACCESS_KEY: foodkoala
      S3_SECRET_KEY: foodkoala-secret
    depends_on:
      mongo: { condition: service_started }
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
      s3: { condition: service_started }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  tracking-service:
    build: ../../src/tracking-service
    image: foodkoala/tracking-service:local
    ports: ["8082:8082"]
    environment:
      # Its own database number; keys are prefixed tracking: anyway
      REDIS_URL: redis://redis:6379/2
      # Order, delivery and rider.location events in
      KAFKA_BROKERS: kafka:29092
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

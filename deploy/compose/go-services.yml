services:
  api-gateway:
    build: ../../src/api-gateway
    ports: ["8080:8080"]
  delivery-service:
    build: ../../src/delivery-service
    image: foodkoala/delivery-service:local
    ports: ["8081:8081"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foodkoala}:${POSTGRES_PASSWORD:-foodkoala}@postgres:5432/${POSTGRES_DB:-foodkoala}
      # Order events in, delivery events out
      KAFKA_BROKERS: kafka:29092
    depends_on:
      delivery-migrate: { condition: service_completed_successfully }
      kafka: { condition: service_started }
    healthcheck:
      # The distroless image has no shell or wget; the binary checks its own /readyz.
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
  delivery-migrate:
    image: foodkoala/delivery-service:local
    pull_policy: never
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-foodkoala}:${POSTGRES_PASSWORD:-foodkoala}@postgres:5432/${POSTGRES_DB:-foodkoala}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  tracking-service:
    build: ../../src/tracking-service
    image: foodkoala/tracking-service:local
    ports: ["8082:8082"]
    environment:
      # Its own database number; keys are prefixed tracking: anyway
      REDIS_URL: redis://redis:6379/2
      # Order, delivery and rider.location events in
      KAFKA_BROKERS: kafka:29092
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_started }
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

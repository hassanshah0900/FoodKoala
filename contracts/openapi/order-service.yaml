openapi: 3.1.0
info:
  title: order-service
  version: 0.1.0
  description: |
    Checkout and the life of an order, from placing it to delivery.

    **Checkout.** `POST /` turns the caller's cart into an order. The
    service asks cart-service for the cart (priced by menu-service just
    then), user-service for the delivery address and restaurant-service
    whether the restaurant is taking orders and delivers there, and for how
    much. A client never sends a price or a fee. Once the order is saved the
    cart is emptied. Send an `Idempotency-Key` with every checkout: retrying
    with the same key returns the order made the first time instead of a
    second one.

    **Life cycle.**

    | From | To | Who |
    |---|---|---|
    | `placed` | `accepted` | the restaurant, with a prep time |
    | `placed` | `rejected` | the restaurant or an admin, with a reason; or `system` when the restaurant hasn't answered within 10 minutes |
    | `placed` | `cancelled` | the customer, or an admin with a reason |
    | `accepted` | `ready` | the restaurant, when the food is ready for pickup |
    | `accepted`, `ready` | `cancelled` | an admin, with a reason |
    | `accepted`, `ready` | `picked_up` | the assigned rider (via `delivery.picked_up`), or an admin from `ready` |
    | `picked_up` | `delivered` | the assigned rider (via `delivery.delivered`), or an admin |

    `delivered`, `rejected` and `cancelled` are final. "The restaurant"
    means its owner, checked with restaurant-service (ADR 0006). Riders
    don't call this API: delivery-service publishes their pickups and
    drop-offs, and order-service applies them (recorded as `rider`). A rider
    may pick up an order the restaurant forgot to mark ready. Nobody calls
    the API as `system`: order-service itself rejects an order still
    `placed` 10 minutes after checkout (`ACCEPT_TIMEOUT_MINUTES`), with the
    reason "Not accepted within 10 minutes", so a customer never waits on a
    kitchen that isn't looking.

    **Who sees what.** Customers see their own orders. Restaurant owners
    see the orders of their restaurants. Admins see every order. Anyone else
    gets 404.

    **Reviews.** Within 7 days of delivery (`REVIEW_WINDOW_DAYS`) the
    customer can rate the order once: the restaurant from 1 to 5, the rider
    from 1 to 5 when a rider delivered it, and an optional comment. A review
    can't be changed afterwards.

    **Vouchers.** Admins create codes that take money off the subtotal: a
    percent (optionally capped) or a flat amount, with a minimum subtotal,
    a validity window, and optionally one restaurant, first orders only, a
    total number of uses and uses per customer (1 by default). A customer
    sees what a code takes off their cart with `GET /vouchers/{code}/discount`
    and applies it with `voucherCode` at checkout. Uses are counted from the
    orders that carry the voucher, so an order rejected or cancelled gives
    its use back. Codes ignore case.

    **Tips.** The customer can add a tip for the rider at checkout
    (`tipPaisa`, up to Rs 1,000). It is added to the total and goes to the
    rider in full.

    **Reports.** A restaurant's owner (or an admin) sees its sales for up
    to 92 days: orders placed, delivered, cancelled and rejected; sales
    (the subtotals of delivered orders) and the voucher discounts on them;
    the average order and prep time; the ten best-selling items; and each
    day's figures, with days counted in Pakistan time.

    **Events.** Every order placed, every status change and every review is
    written to an outbox in the same transaction as the change, for
    publishing to Kafka as `order.placed`, `order.status_changed` and
    `order.reviewed` (`contracts/events`). It reads `delivery.picked_up` and
    `delivery.delivered`.

    **Money** is in paisa (integer, 1 PKR = 100 paisa). Menu prices include
    sales tax.
servers:
  - url: http://localhost:8080/api/v1/orders
    description: Through api-gateway
  - url: http://localhost:3006
    description: Service directly (send the identity headers yourself)

security:
  - bearerAuth: []

tags:
  - name: checkout
    description: Turning the cart into an order
  - name: orders
    description: Reading orders and moving them along
  - name: restaurant
    description: A restaurant's incoming orders
  - name: reviews
    description: The customer's rating of a delivered order
  - name: reports
    description: How a restaurant is selling
  - name: vouchers
    description: Discount codes, managed by admins and applied at checkout
  - name: health
    description: Liveness and readiness probes

paths:
  /:
    post:
      tags: [checkout]
      operationId: checkout
      summary: Place an order from my cart
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A new random value (e.g. a UUID) per checkout attempt, reused on retries
          schema: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9_-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Checkout' }
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Retry of a checkout that already placed this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The cart is empty, or the restaurant is not taking orders right now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            The order can't be placed as it is: a cart line has a problem, the
            address is unknown, the restaurant doesn't deliver there, the
            subtotal is under the minimum order, the payment method isn't
            available yet, or the voucher can't be used (see
            `VoucherRefused`). `message` lists every reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [orders]
      operationId: listMyOrders
      summary: My orders, newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /restaurants/{restaurantId}/orders:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [restaurant]
      operationId: listRestaurantOrders
      summary: A restaurant's orders, newest first (owner or admin)
      parameters:
        - name: status
          in: query
          description: 'Only orders in these statuses, comma separated, e.g. `placed,accepted,ready`'
          schema: { type: string, examples: ['placed,accepted,ready'] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: One order, with its timeline
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /{id}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: changeOrderStatus
      summary: Accept, reject, mark ready, pick up, deliver or cancel
      description: See the life cycle table above for who may make which change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChange' }
      responses:
        '200':
          description: Order after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The order is not in a status that allows this change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /{id}/review:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [reviews]
      operationId: getOrderReview
      summary: The review of an order
      description: Visible to whoever can see the order. 404 until it is reviewed.
      responses:
        '200':
          description: Review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [reviews]
      operationId: reviewOrder
      summary: Rate a delivered order (its customer only, once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
            example: { restaurantRating: 5, riderRating: 4, comment: Biryani was hot and on time }
      responses:
        '201':
          description: Review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          description: Invalid body, or `riderRating` for an order no rider delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not delivered, already reviewed, or the review window has closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /restaurants/{restaurantId}/report:
    parameters:
      - name: restaurantId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [reports]
      operationId: restaurantSalesReport
      summary: Sales of the orders placed in a period (owner or admin)
      parameters:
        - name: from
          in: query
          description: Start (RFC 3339), inclusive; 7 days before `to` by default
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End (RFC 3339), exclusive, at most 92 days after `from`; now by default
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /vouchers:
    post:
      tags: [vouchers]
      operationId: createVoucher
      summary: Create a voucher (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherCreate' }
            example:
              code: KOALA20
              description: 20% off, up to Rs 150
              kind: percent
              value: 20
              maxDiscountPaisa: 15000
              minSubtotalPaisa: 50000
              startsAt: '2026-11-10T00:00:00+05:00'
              endsAt: '2026-12-01T00:00:00+05:00'
      responses:
        '201':
          description: Voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminsOnly' }
        '409':
          description: The code is taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      tags: [vouchers]
      operationId: listVouchers
      summary: Every voucher, newest first (admins)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of vouchers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminsOnly' }

  /vouchers/{id}:
    patch:
      tags: [vouchers]
      operationId: updateVoucher
      summary: Pause, extend or limit a voucher (admins)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherUpdate' }
            example: { active: false }
      responses:
        '200':
          description: Voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AdminsOnly' }
        '404':
          description: No such voucher
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: '`endsAt` is not after the voucher starts'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /vouchers/{code}/discount:
    get:
      tags: [vouchers]
      operationId: voucherDiscount
      summary: What a code takes off my cart now
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{3,32}$' }
      responses:
        '200':
          description: The discount
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherDiscount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The cart is empty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/VoucherRefused' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /healthz:
    get:
      tags: [health]
      operationId: liveness
      security: [{}]
      summary: Liveness probe
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /readyz:
    get:
      tags: [health]
      operationId: readiness
      security: [{}]
      summary: Readiness probe
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '503':
          description: PostgreSQL is unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from auth-service, verified by api-gateway.

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, const: ok }
    BadRequest:
      description: Invalid body, query, header or id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No authenticated user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Signed in, but not allowed to make this change or see this restaurant's orders
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such order or restaurant, or not one the caller can see
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AdminsOnly:
      description: Signed in, but not an admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    VoucherRefused:
      description: |
        The voucher can't be used on this cart, with the reason in `message`:
        no such code, expired or paused, not valid yet, another restaurant's,
        first orders only, already used by me, fully used, or the subtotal
        is too small.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { statusCode: 422, error: Unprocessable Entity, message: ['You have already used this voucher'] }
    Unavailable:
      description: cart-service, user-service or restaurant-service could not be reached
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ReviewCreate:
      type: object
      required: [restaurantRating]
      additionalProperties: false
      properties:
        restaurantRating: { type: integer, minimum: 1, maximum: 5 }
        riderRating:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: Only for orders a rider delivered
        comment: { type: [string, 'null'], minLength: 1, maxLength: 500 }

    Review:
      type: object
      required: [orderId, restaurantId, riderId, restaurantRating, riderRating, comment, createdAt]
      properties:
        orderId: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        riderId: { type: [string, 'null'], format: uuid, description: Who delivered it; null when an admin recorded the delivery }
        restaurantRating: { type: integer, minimum: 1, maximum: 5 }
        riderRating: { type: [integer, 'null'], minimum: 1, maximum: 5 }
        comment: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    Status:
      type: string
      enum: [placed, accepted, ready, picked_up, delivered, rejected, cancelled]

    PaymentMethod:
      type: string
      enum: [cod, card, jazzcash, easypaisa]
      description: Only `cod` (cash on delivery) is accepted until payment-service takes payments.

    Location:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    Checkout:
      type: object
      required: [addressId, paymentMethod]
      additionalProperties: false
      properties:
        addressId: { type: string, format: uuid, description: One of my saved addresses (user-service) }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        note: { type: [string, 'null'], minLength: 1, maxLength: 500, description: 'For the restaurant, e.g. "no cutlery"' }
        voucherCode: { type: [string, 'null'], minLength: 1, maxLength: 32, description: Takes the voucher's discount off; 422 if it can't be used }
        tipPaisa: { type: integer, minimum: 0, maximum: 100000, default: 0, description: 'For the rider, added to the total' }

    StatusChange:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { $ref: '#/components/schemas/Status' }
        reason: { type: string, minLength: 1, maxLength: 500, description: 'Needed to reject, and for an admin to cancel' }
        prepTimeMinutes: { type: integer, minimum: 5, maximum: 120, description: Needed to accept }

    OrderLine:
      type: object
      required: [itemId, name, quantity, options, note, unitPricePaisa, lineTotalPaisa]
      properties:
        itemId: { type: string, format: uuid }
        name: { type: string }
        quantity: { type: integer }
        options:
          type: array
          items:
            type: object
            required: [id, group, name, pricePaisa]
            properties:
              id: { type: string, format: uuid }
              group: { type: string }
              name: { type: string }
              pricePaisa: { type: integer }
        note: { type: [string, 'null'] }
        unitPricePaisa: { type: integer }
        lineTotalPaisa: { type: integer }

    DeliveryAddress:
      type: object
      description: A copy of the saved address as it was at checkout
      required: [label, line1, area, city, landmark, instructions, location]
      properties:
        label: { type: string, examples: [home] }
        line1: { type: string }
        area: { type: string }
        city: { type: string }
        landmark: { type: [string, 'null'] }
        instructions: { type: [string, 'null'], description: Notes for the rider }
        location: { $ref: '#/components/schemas/Location' }

    TimelineEntry:
      type: object
      required: [status, at, by, reason]
      properties:
        status: { $ref: '#/components/schemas/Status' }
        at: { type: string, format: date-time }
        by: { type: string, enum: [customer, restaurant, admin, rider, system] }
        reason: { type: [string, 'null'] }

    Order:
      type: object
      required:
        - id
        - status
        - customerId
        - customerPhone
        - restaurant
        - lines
        - subtotalPaisa
        - deliveryFeePaisa
        - discountPaisa
        - voucherCode
        - tipPaisa
        - totalPaisa
        - paymentMethod
        - deliveryAddress
        - note
        - prepTimeMinutes
        - estimatedDeliveryAt
        - timeline
        - placedAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        customerId: { type: string, format: uuid }
        customerPhone: { type: string, description: For the restaurant and rider to call }
        restaurant:
          type: object
          required: [id, name, location]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            location:
              description: Where the rider picks up; null for orders placed before it was recorded
              oneOf:
                - $ref: '#/components/schemas/Location'
                - type: 'null'
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        subtotalPaisa: { type: integer }
        deliveryFeePaisa: { type: integer }
        discountPaisa: { type: integer, description: Taken off the subtotal by the voucher; 0 without one }
        voucherCode: { type: [string, 'null'] }
        tipPaisa: { type: integer, description: For the rider; 0 without one }
        totalPaisa: { type: integer, description: subtotalPaisa + deliveryFeePaisa - discountPaisa + tipPaisa }
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        deliveryAddress: { $ref: '#/components/schemas/DeliveryAddress' }
        note: { type: [string, 'null'] }
        prepTimeMinutes: { type: [integer, 'null'], description: Set when the restaurant accepts }
        estimatedDeliveryAt:
          type: string
          format: date-time
          description: From the delivery zone's time at checkout, pushed later if the prep time needs it
        timeline:
          type: array
          description: Every status the order has had, oldest first
          items: { $ref: '#/components/schemas/TimelineEntry' }
        placedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SalesReport:
      type: object
      required:
        - restaurantId
        - from
        - to
        - timeZone
        - orders
        - salesPaisa
        - discountsPaisa
        - averageOrderPaisa
        - averagePrepMinutes
        - topItems
        - days
      properties:
        restaurantId: { type: string, format: uuid }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        timeZone: { type: string, const: Asia/Karachi, description: The zone days are counted in }
        orders:
          type: object
          description: Orders placed in the period, by what became of them (the rest are still in progress)
          required: [placed, delivered, cancelled, rejected]
          properties:
            placed: { type: integer }
            delivered: { type: integer }
            cancelled: { type: integer }
            rejected: { type: integer }
        salesPaisa: { type: integer, description: Subtotals of the delivered orders }
        discountsPaisa: { type: integer, description: Voucher discounts on those orders }
        averageOrderPaisa: { type: [integer, 'null'], description: salesPaisa / delivered; null without deliveries }
        averagePrepMinutes: { type: [number, 'null'], description: One decimal; null when no order was accepted }
        topItems:
          type: array
          description: Up to 10 items of delivered orders, most sold first
          items:
            type: object
            required: [itemId, name, quantity, salesPaisa]
            properties:
              itemId: { type: string, format: uuid }
              name: { type: string, description: The latest name it was sold under }
              quantity: { type: integer }
              salesPaisa: { type: integer }
        days:
          type: array
          description: Days with orders, oldest first
          items:
            type: object
            required: [date, placed, delivered, salesPaisa]
            properties:
              date: { type: string, format: date }
              placed: { type: integer }
              delivered: { type: integer }
              salesPaisa: { type: integer }

    VoucherCreate:
      type: object
      required: [code, description, kind, value, startsAt, endsAt]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{3,32}$', description: Stored in upper case }
        description: { type: string, minLength: 1, maxLength: 200, description: What customers are told it gives }
        kind: { type: string, enum: [percent, flat] }
        value: { type: integer, minimum: 1, description: 'Percent off (at most 100) for `percent`, paisa off for `flat`' }
        maxDiscountPaisa: { type: [integer, 'null'], minimum: 1, description: Caps a `percent` discount; only for `percent` }
        minSubtotalPaisa: { type: integer, minimum: 0, default: 0 }
        restaurantId: { type: [string, 'null'], format: uuid, description: Only at this restaurant; null for any }
        firstOrderOnly: { type: boolean, default: false, description: Only for customers with no order that stands }
        usageLimit: { type: [integer, 'null'], minimum: 1, description: Uses across all customers; null for no limit }
        perCustomerLimit: { type: integer, minimum: 1, default: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: After startsAt }

    VoucherUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        usageLimit: { type: [integer, 'null'], minimum: 1 }
        endsAt: { type: string, format: date-time }
        active: { type: boolean, description: false pauses it }

    Voucher:
      type: object
      required:
        - id
        - code
        - description
        - kind
        - value
        - maxDiscountPaisa
        - minSubtotalPaisa
        - restaurantId
        - firstOrderOnly
        - usageLimit
        - perCustomerLimit
        - startsAt
        - endsAt
        - active
        - used
        - createdAt
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        description: { type: string }
        kind: { type: string, enum: [percent, flat] }
        value: { type: integer }
        maxDiscountPaisa: { type: [integer, 'null'] }
        minSubtotalPaisa: { type: integer }
        restaurantId: { type: [string, 'null'], format: uuid }
        firstOrderOnly: { type: boolean }
        usageLimit: { type: [integer, 'null'] }
        perCustomerLimit: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        active: { type: boolean }
        used: { type: integer, description: Orders that carry it and were not rejected or cancelled }
        createdAt: { type: string, format: date-time }

    VoucherPage:
      type: object
      required: [items, page, limit, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Voucher' }
        page: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }

    VoucherDiscount:
      type: object
      required: [code, description, discountPaisa]
      properties:
        code: { type: string }
        description: { type: string }
        discountPaisa: { type: integer, description: What it takes off the current cart's subtotal }

    OrderPage:
      type: object
      required: [items, page, limit, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        page: { type: integer }
        limit: { type: integer }
        hasMore: { type: boolean }

    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }

openapi: 3.1.0
info:
  title: menu-service
  version: 0.1.0
  description: |
    Restaurant menus: categories, items, choices (sizes, add-ons) and
    availability. It also prices order lines, which is the only place prices
    are computed. Cart and order services never trust a price sent by a
    client.

    **Who can do what.** Reading a menu and pricing lines are public. Changing
    a menu needs the restaurant's owner or an admin. menu-service asks
    restaurant-service, forwarding the caller's identity headers (ADR 0006).
    If restaurant-service is unreachable, changes fail with 503.

    **Choices.** An item has option groups. A size is a group with
    `minSelect: 1, maxSelect: 1`. "Add extra toppings" is a group with
    `minSelect: 0, maxSelect: 3`. When options are saved without an `id`
    they get one. Send the existing `id` back to keep it, so carts that
    reference it stay valid.

    **Money** is in paisa (integer, 1 PKR = 100 paisa).
servers:
  - url: http://localhost:8080/api/v1/menus
    description: Through api-gateway
  - url: http://localhost:3004
    description: Service directly (send the identity headers yourself)

security:
  - bearerAuth: []

tags:
  - name: menu
    description: The public menu of a restaurant
  - name: categories
    description: Menu sections, e.g. Biryani, Deals, Drinks
  - name: items
    description: Dishes and their choices
  - name: pricing
    description: Server-side prices for cart and order lines
  - name: health
    description: Liveness and readiness probes

paths:
  /restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [menu]
      operationId: getMenu
      summary: A restaurant's menu, in display order
      description: Sold-out items and options are included, with `isAvailable` set to false.
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Menu (empty `categories` when the restaurant has none yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /restaurants/{restaurantId}/categories:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [categories]
      operationId: createCategory
      summary: Add a category at the end of the menu (up to 50)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
            example: { name: Biryani, description: Cooked fresh on dum every morning }
      responses:
        '201':
          description: Category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /restaurants/{restaurantId}/categories/order:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    put:
      tags: [categories]
      operationId: reorderCategories
      summary: Set the order of all categories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '204': { description: Reordered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [categories]
      operationId: updateCategory
      summary: Rename or describe a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [categories]
      operationId: deleteCategory
      summary: Delete an empty category
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /categories/{categoryId}/items:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    post:
      tags: [items]
      operationId: createItem
      summary: Add an item at the end of a category (up to 300 per restaurant)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemCreate' }
            example:
              name: Chicken Biryani
              description: Basmati rice, spiced chicken, raita on the side
              pricePaisa: 45000
              optionGroups:
                - name: Choose size
                  minSelect: 1
                  maxSelect: 1
                  options:
                    - { name: Single, pricePaisa: 0 }
                    - { name: Full (serves 2), pricePaisa: 35000 }
                - name: Add extras
                  minSelect: 0
                  maxSelect: 2
                  options:
                    - { name: Extra raita, pricePaisa: 5000 }
                    - { name: Shami kabab, pricePaisa: 8000 }
      responses:
        '201':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /categories/{categoryId}/items/order:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    put:
      tags: [items]
      operationId: reorderItems
      summary: Set the order of all items in a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Order' }
      responses:
        '204': { description: Reordered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [items]
      operationId: getItem
      summary: One item
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [items]
      operationId: updateItem
      summary: Change an item, mark it sold out, or move it to another category
      description: |
        `optionGroups` replaces all groups. Keep option ids you want to keep.
        Moving to another category (`categoryId`) puts the item last there.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemUpdate' }
            example: { isAvailable: false }
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [items]
      operationId: deleteItem
      summary: Delete an item
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /restaurants/{restaurantId}/price:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [pricing]
      operationId: priceLines
      summary: Check order lines against the menu and price them
      description: |
        Every item must belong to this restaurant and be available. Every
        chosen option must belong to the item and be available. Each option
        group's `minSelect`/`maxSelect` must hold. Otherwise the response is
        422, with one message per problem, prefixed with the line index.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceRequest' }
      responses:
        '200':
          description: Priced lines
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricedLines' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: A line does not match the menu (sold out, missing a required choice, ...)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                statusCode: 422
                error: Unprocessable Entity
                message: ['lines[0]: Chicken Biryani is sold out', 'lines[1]: choose 1 in "Choose size"']

  /healthz:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness probe
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /readyz:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness probe
      description: Fails with 503 when PostgreSQL is unreachable.
      security: []
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '503': { description: Not ready }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from auth-service, verified by api-gateway.

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Money:
      type: integer
      minimum: 0
      maximum: 10000000
      description: Paisa

    Option:
      type: object
      required: [id, name, pricePaisa, isAvailable]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        pricePaisa: { $ref: '#/components/schemas/Money', description: Added to the item price }
        isAvailable: { type: boolean }

    OptionGroup:
      type: object
      required: [id, name, minSelect, maxSelect, options]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/Option' }

    OptionInput:
      type: object
      required: [name, pricePaisa]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid, description: Send to keep an existing option's id }
        name: { type: string, minLength: 1, maxLength: 80 }
        pricePaisa: { $ref: '#/components/schemas/Money' }
        isAvailable: { type: boolean, default: true }

    OptionGroupInput:
      type: object
      required: [name, minSelect, maxSelect, options]
      additionalProperties: false
      description: '0 <= minSelect <= maxSelect <= number of options'
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 80 }
        minSelect: { type: integer, minimum: 0 }
        maxSelect: { type: integer, minimum: 1 }
        options:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: '#/components/schemas/OptionInput' }

    Item:
      type: object
      required:
        [id, restaurantId, categoryId, name, description, imageUrl, pricePaisa, isAvailable, optionGroups, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        pricePaisa: { $ref: '#/components/schemas/Money' }
        isAvailable: { type: boolean, description: False when sold out }
        optionGroups:
          type: array
          items: { $ref: '#/components/schemas/OptionGroup' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ItemCreate:
      type: object
      required: [name, pricePaisa]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        imageUrl: { type: [string, 'null'], format: uri, pattern: '^https://' }
        pricePaisa: { $ref: '#/components/schemas/Money' }
        isAvailable: { type: boolean, default: true }
        optionGroups:
          type: array
          maxItems: 10
          default: []
          items: { $ref: '#/components/schemas/OptionGroupInput' }

    ItemUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        categoryId: { type: string, format: uuid, description: Another category of the same restaurant }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        imageUrl: { type: [string, 'null'], format: uri, pattern: '^https://' }
        pricePaisa: { $ref: '#/components/schemas/Money' }
        isAvailable: { type: boolean }
        optionGroups:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/OptionGroupInput' }

    Category:
      type: object
      required: [id, restaurantId, name, description, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        restaurantId: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CategoryCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 300 }

    CategoryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 300 }

    Menu:
      type: object
      required: [restaurantId, categories]
      properties:
        restaurantId: { type: string, format: uuid }
        categories:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Category'
              - type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }

    Order:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          uniqueItems: true
          description: Every id of the list, exactly once, in the new order
          items: { type: string, format: uuid }

    PriceRequest:
      type: object
      required: [lines]
      additionalProperties: false
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [itemId, quantity]
            additionalProperties: false
            properties:
              itemId: { type: string, format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 50 }
              optionIds:
                type: array
                uniqueItems: true
                maxItems: 50
                default: []
                items: { type: string, format: uuid }
      example:
        lines:
          - itemId: 0b9d1c7e-3f5a-4c2e-9a1b-6d8e7f0a1b2c
            quantity: 2
            optionIds: [5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9]

    PricedLines:
      type: object
      required: [restaurantId, lines, subtotalPaisa]
      properties:
        restaurantId: { type: string, format: uuid }
        lines:
          type: array
          items:
            type: object
            required: [itemId, name, quantity, options, unitPricePaisa, lineTotalPaisa]
            properties:
              itemId: { type: string, format: uuid }
              name: { type: string }
              quantity: { type: integer }
              options:
                type: array
                items:
                  type: object
                  required: [id, group, name, pricePaisa]
                  properties:
                    id: { type: string, format: uuid }
                    group: { type: string, examples: [Choose size] }
                    name: { type: string }
                    pricePaisa: { type: integer }
              unitPricePaisa: { type: integer, description: Item price plus chosen options }
              lineTotalPaisa: { type: integer, description: unitPricePaisa times quantity }
        subtotalPaisa: { type: integer, description: 'Sum of lineTotalPaisa, before delivery fee and tax' }

    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }

  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, const: ok }
    BadRequest:
      description: Invalid body or id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No authenticated user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Signed in, but not the restaurant's owner or an admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such restaurant, category or item
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A limit was reached, or the category still has items
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: restaurant-service could not be reached to check ownership
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

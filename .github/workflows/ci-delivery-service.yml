# CI for src/delivery-service (go); the jobs are in go-service.yml.
# Its tests need: postgres + kafka.
name: delivery-service

on:
  # On pull requests into main, and on main itself after a merge, but only
  # when something that affects this service changed.
  pull_request:
    branches: [main]
    paths: &paths
      - src/delivery-service/**
      - .github/workflows/ci-delivery-service.yml
      - .github/workflows/go-service.yml
      - .golangci.yml
  push:
    branches: [main]
    paths: *paths
  # Lets you start it by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same PR cancels the run still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/go-service.yml
    with:
      service: delivery-service
      postgres: true
      kafka: true

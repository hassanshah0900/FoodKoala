name: delivery-service

on:
  pull_request:
    branches: [main]
    paths: &paths
      - src/delivery-service/**
      - .github/workflows/ci-delivery-service.yml
      - .github/workflows/go-service.yml
      - .golangci.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/go-service.yml
    with:
      service: delivery-service
      postgres: true
      kafka: true

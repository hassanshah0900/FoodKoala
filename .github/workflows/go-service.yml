# Reusable CI for one Go service, called by ci-<service>.yml.
name: go-service

on:
  workflow_call:
    inputs:
      service:
        description: Folder under src/, e.g. delivery-service
        required: true
        type: string
      postgres:
        type: boolean
        default: false
      redis:
        type: boolean
        default: false
      kafka:
        type: boolean
        default: false
      mongo:
        type: boolean
        default: false
      # S3-compatible storage (SeaweedFS, as in deploy/compose/infra.yml).
      s3:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/${{ inputs.service }}/go.mod
          cache-dependency-path: src/${{ inputs.service }}/go.sum

      # Linters (go vet, errcheck, staticcheck, ...) are chosen in /.golangci.yml.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: src/${{ inputs.service }}

      - name: Format
        run: |
          diff=$(golangci-lint fmt --diff ./...)
          if [ -n "$diff" ]; then
            echo "$diff"
            echo "::error::Run 'golangci-lint fmt' (or gofmt -w .) in src/${{ inputs.service }}"
            exit 1
          fi

      - name: Build
        run: go build ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/${{ inputs.service }}

    # A service container whose image is '' is not started: each service
    # opts in to the infrastructure its tests need.
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgis/postgis:16-3.4' || '' }}
        env:
          POSTGRES_USER: foodkoala
          POSTGRES_PASSWORD: foodkoala
          POSTGRES_DB: foodkoala
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodkoala"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: ${{ inputs.redis && 'redis:7.4-alpine' || '' }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: ${{ inputs.kafka && 'apache/kafka:3.8.1' || '' }}
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30
      mongo:
        image: ${{ inputs.mongo && 'mongo:7.0' || '' }}
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/${{ inputs.service }}/go.mod
          cache-dependency-path: src/${{ inputs.service }}/go.sum

      # A service container can't be given a command, and SeaweedFS needs one.
      - name: Start S3 storage
        if: inputs.s3
        working-directory: .
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/deploy/compose/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.53 server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8333 && exit 0
            sleep 1
          done
          docker logs s3
          exit 1

      # Integration tests skip when their variable is unset, so set only the
      # ones whose container is running.
      - name: Point the tests at the containers
        run: |
          if ${{ inputs.postgres }}; then echo "DATABASE_URL=postgres://foodkoala:foodkoala@localhost:5432/foodkoala" >> "$GITHUB_ENV"; fi
          if ${{ inputs.redis }}; then echo "REDIS_URL=redis://localhost:6379" >> "$GITHUB_ENV"; fi
          if ${{ inputs.kafka }}; then echo "KAFKA_BROKERS=localhost:9092" >> "$GITHUB_ENV"; fi
          if ${{ inputs.mongo }}; then echo "MONGO_URL=mongodb://localhost:27017" >> "$GITHUB_ENV"; fi
          if ${{ inputs.s3 }}; then
            # The development credentials of deploy/compose/seaweedfs/s3.json.
            { echo "S3_ENDPOINT=localhost:8333"; echo "S3_ACCESS_KEY=foodkoala"; echo "S3_SECRET_KEY=foodkoala-secret"; } >> "$GITHUB_ENV"
          fi

      # -p 1: packages share one database and would migrate and empty it at once.
      - name: Tests
        run: go test -race -p 1 ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Proves the Dockerfile still builds; not pushed until we deploy.
      - uses: docker/build-push-action@v7
        with:
          context: src/${{ inputs.service }}
          push: false
          tags: foodkoala/${{ inputs.service }}:ci
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

# Checks that every commit in a pull request follows Conventional Commits with
# a scope from commitlint.config.cjs, as the Husky hook does locally.
name: commitlint

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the PR's commits between base and head exist locally.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The root package.json holds commitlint (and Husky).
      - run: npm ci

      - name: Check the PR's commits
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

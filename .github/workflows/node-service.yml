# Reusable CI for one NestJS service, called by ci-<service>.yml.
name: node-service

on:
  workflow_call:
    inputs:
      service:
        description: Folder under src/, e.g. order-service
        required: true
        type: string
      postgres:
        type: boolean
        default: false
      redis:
        type: boolean
        default: false
      kafka:
        type: boolean
        default: false

permissions:
  contents: read

env:
  NO_UPDATE_NOTIFIER: '1'
  npm_config_fund: 'false'

jobs:
  check:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/${{ inputs.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the Dockerfile's node:24-alpine
          cache: npm
          cache-dependency-path: src/${{ inputs.service }}/package-lock.json

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/${{ inputs.service }}

    # A service container whose image is '' is not started: each service
    # opts in to the infrastructure its tests need.
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgis/postgis:16-3.4' || '' }}
        env:
          POSTGRES_USER: foodkoala
          POSTGRES_PASSWORD: foodkoala
          POSTGRES_DB: foodkoala
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodkoala"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: ${{ inputs.redis && 'redis:7.4-alpine' || '' }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: ${{ inputs.kafka && 'apache/kafka:3.8.1' || '' }}
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30

    # Unconditional is safe here: the Node tests never skip on these.
    env:
      DATABASE_URL: postgres://foodkoala:foodkoala@localhost:5432/foodkoala
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/${{ inputs.service }}/package-lock.json

      - run: npm ci

      # Only with a broker: an empty KAFKA_BROKERS would make the Kafka tests
      # run against a broker named ''.
      - name: Point the tests at Kafka
        if: inputs.kafka
        run: echo "KAFKA_BROKERS=localhost:9092" >> "$GITHUB_ENV"

      # The migrate script runs from dist/, as in production.
      - name: Migrate the database
        if: inputs.postgres
        run: |
          npm run build
          npm run db:migrate

      - name: End-to-end tests
        run: npm run test:e2e

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Proves the Dockerfile still builds; not pushed until we deploy.
      - uses: docker/build-push-action@v7
        with:
          context: src/${{ inputs.service }}
          push: false
          tags: foodkoala/${{ inputs.service }}:ci
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

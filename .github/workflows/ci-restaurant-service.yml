name: restaurant-service

on:
  pull_request:
    branches: [main]
    paths: &paths
      - src/restaurant-service/**
      - .github/workflows/ci-restaurant-service.yml
      - .github/workflows/node-service.yml
      - biome.json
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/node-service.yml
    with:
      service: restaurant-service
      postgres: true

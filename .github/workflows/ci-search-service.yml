name: search-service

on:
  pull_request:
    branches: [main]
    paths: &paths
      - src/search-service/**
      - .github/workflows/ci-search-service.yml
      - .github/workflows/python-service.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/python-service.yml
    with:
      service: search-service
      elasticsearch: true
      kafka: true

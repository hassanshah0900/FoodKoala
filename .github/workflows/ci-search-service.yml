# CI for src/search-service (python); the jobs are in python-service.yml.
# Its tests need: elasticsearch + kafka.
name: search-service

on:
  # On pull requests into main, and on main itself after a merge, but only
  # when something that affects this service changed.
  pull_request:
    branches: [main]
    paths: &paths
      - src/search-service/**
      - .github/workflows/ci-search-service.yml
      - .github/workflows/python-service.yml
  push:
    branches: [main]
    paths: *paths
  # Lets you start it by hand from the Actions tab.
  workflow_dispatch:

# A new push to the same PR cancels the run still going for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/python-service.yml
    with:
      service: search-service
      elasticsearch: true
      kafka: true

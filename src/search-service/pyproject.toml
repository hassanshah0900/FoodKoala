[project]
name = "search-service"
version = "0.1.0"
description = "Restaurant and dish search with location filters and ranking, backed by Elasticsearch."
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.11",
    "elasticsearch>=8.15,<9",
    "fastapi>=0.115",
    "pydantic-settings>=2.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=0.1",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

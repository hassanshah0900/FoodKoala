[project]
name = "payment-service"
version = "0.1.0"
description = "Payments for Pakistan: cash on delivery, JazzCash, Easypaisa, cards, refunds and wallet."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "confluent-kafka>=2.11",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.9",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=0.1",
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
# Libraries without type information (confluent-kafka ships partial stubs).
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
